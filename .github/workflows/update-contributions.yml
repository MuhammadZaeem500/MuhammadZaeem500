
name: Update Contribution Heatmap

on:
  # Update every day at 06:17 UTC
  schedule:
    - cron: "17 6 * * *"

  # Allow manual execution
  workflow_dispatch:

  # Refresh after changes to main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-heatmap
  cancel-in-progress: false

jobs:
  update-heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch GitHub contributions
        env:
          GH_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}
        run: |
          python scripts/fetch_contributions.py

      - name: Generate contribution heatmap
        run: |
          python scripts/render_heatmap_svg.py

      - name: Commit updated heatmap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution heatmap [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"

          # Both author and committer should be the bot.
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
